[workspace]
resolver = "2"
members = [
    "crates/mandate-core",
    "crates/mandate-soroban",
    "contracts/allowlist-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Chongai-Cli/Mandate"
rust-version = "1.84"

[workspace.dependencies]
mandate-core = { path = "crates/mandate-core" }
mandate-soroban = { path = "crates/mandate-soroban" }
proptest = "1.5"
soroban-sdk = { version = "=26.1.0", features = ["hazmat-address"] }
stellar-accounts = "=0.7.2"

# Soroban contracts require a small, panic=abort release build.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
